<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tinta.studio — Demos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; max-width: 600px; padding: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
    p { color: #a0a0a0; margin-bottom: 2rem; }
    .cards { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 2rem; width: 260px; text-decoration: none; color: inherit; transition: border-color 0.2s, transform 0.2s; }
    .card:hover { border-color: #4a4a4a; transform: translateY(-2px); }
    .card h2 { font-size: 1.3rem; margin-bottom: 0.5rem; }
    .card .tag { display: inline-block; background: #2a2a2a; padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.8rem; color: #a0a0a0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>tinta.studio</h1>
    <p>Demos de landings para estudios</p>
    <div class="cards">
      <a href="/turnie/karonte/" class="card">
        <h2>Karonte</h2>
        <span class="tag">Tattoo Studio</span>
        <p style="margin-top:0.5rem;font-size:0.85rem;color:#808080;">Palermo, Buenos Aires</p>
      </a>
      <a href="/turnie/lumiere/" class="card">
        <h2>Lumière</h2>
        <span class="tag">Centro de Estética</span>
        <p style="margin-top:0.5rem;font-size:0.85rem;color:#808080;">La Floresta, Quito</p>
      </a>
    </div>
  </div>
</body>
</html>
